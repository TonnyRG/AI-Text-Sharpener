name: tests

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install fonts used by rendering tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-liberation fonts-noto-cjk
          fc-cache -f
      - name: Install Studio and test dependencies
        run: |
          python -m pip install --upgrade pip
          # PaddleOCR and downloaded formula models remain optional.
          pip install -e '.[dev]'
      - name: Verify mixed-language font coverage
        run: |
          python - <<'PY'
          from ai_text_sharpener.typography import candidate_fonts
          if not candidate_fonts('中文 English 混排 123'):
              raise SystemExit('Rendering tests require a font covering Chinese and Latin characters.')
          PY
      - name: Check browser JavaScript
        run: |
          node --check src/ai_text_sharpener/web/app.js
          node --test tests/*.test.cjs
      - name: Run unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -v -ra --junitxml=test-results.xml
      - name: Summarize unit tests
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('test-results.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not report.exists():
                  summary.write('Tests did not produce a report. Check the preceding setup steps.\n')
              else:
                  for suite in ET.parse(report).getroot().iter('testsuite'):
                      summary.write(f"Tests: {suite.get('tests')}; failures: {suite.get('failures')}; errors: {suite.get('errors')}; skipped: {suite.get('skipped')}\n\n")
                  for case in ET.parse(report).getroot().iter('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          name = f"{case.get('classname')}::{case.get('name')}"
                          summary.write(f"### {name}\n\n" + '\n'.join('    ' + line for line in (failure.text or '').splitlines()) + '\n\n')
                          message = (name + ': ' + failure.get('message', '')).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print(f'::error::{message}')
          PY
