name: tests

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Studio and test dependencies
        run: |
          python -m pip install --upgrade pip
          # PaddleOCR and downloaded formula models remain optional.
          pip install -e '.[dev]'
      - name: Check browser JavaScript
        run: |
          node --check src/ai_text_sharpener/web/app.js
          node --test tests/canvas-geometry.test.cjs
      - name: Run unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -v -ra
