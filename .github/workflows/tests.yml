name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install non-Paddle deps
        run: |
          python -m pip install --upgrade pip
          # Skip paddlepaddle / paddleocr in CI — model downloads + native deps
          # are too heavy for a public CI runner.  OCR-touching tests call
          # pytest.importorskip("paddleocr") and skip cleanly when paddle is absent.
          pip install pillow opencv-python numpy resvg-py click python-pptx fonttools pytest pytest-cov
          pip install -e . --no-deps
      - name: Run unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -v -ra
